---
services:
  db:
    image: "docker.io/library/postgres:17"
    environment:
      POSTGRES_DB: "kuss"
      POSTGRES_USER: "kuss"
      POSTGRES_PASSWORD: "kuss"
    command:
    - "postgres"
    - "-c"
    - "deadlock_timeout=100ms"
    ports:
    - "127.0.0.1:5432:5432"
    healthcheck:
      test:
      - "CMD-SHELL"
      - "pg_isready -h localhost -U kuss -d kuss"
      interval: "2s"
      timeout: "3s"
      retries: 30
  app:
    build: "."
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/kuss"
    ports:
    - "8080:8080"
    restart: "on-failure"
    depends_on:
      db:
        condition: "service_healthy"
