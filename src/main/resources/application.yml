---
spring:
  application:
    name: "unified-service-scheduler"
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:postgresql://localhost:5432/kuss"
    username: "kuss"
    password: "${SPRING_DATASOURCE_PASSWORD:kuss}"
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: "validate"
  flyway:
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: "readinessState,db"
---
spring:
  config:
    activate:
      on-profile: "prod"
  datasource:
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
logging:
  structured:
    format:
      console: "ecs"
