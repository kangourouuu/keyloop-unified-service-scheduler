---
spring:
  application:
    name: "unified-service-scheduler"
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:postgresql://localhost:5432/kuss"
    username: "kuss"
    password: "kuss"
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: "validate"
  flyway:
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
---
spring:
  config:
    activate:
      on-profile: "prod"
  datasource:
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
logging:
  structured:
    format:
      console: "ecs"
